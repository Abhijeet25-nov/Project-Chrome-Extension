<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminder Application</title>
</head>
<body>
    <h1>Reminder Extension</h1>
    <div>
        <div>

            <span>Title :</span>
            <input type="title" name="title" id="title" placeholder="Enter your Work...">
            
        </div>
        <div>

            <span>Date:</span>
            <input type="date" name="date" id="date" placeholder="Enter the date...">

        </div>
        <div>

            <span>Time:</span>
            <input type="time" name="time" id="time" placeholder="Enter time...">

        </div>

        <button type="submit" class="btn" onclick="return confirm('ARE YOU SURE you want to proceed..?')">ADD REMINDER</button>
    </div>
</body>
</html>
