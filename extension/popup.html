<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminder Extension</title>
    <!-- <link rel="stylesheet" href="popup.css"> -->
</head>
<body>
    <!-- <h1>Reminder Extension</h1>
    <p>My Extension is working</p> -->
    <div class="container">
        <h1>Reminder</h1>

        <form id="reminderForm">

            <div>
                <label for="title">Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter your reminder"
                    required
                >
            </div>

            <div>
                <label for="date">Date</label>
                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >
            </div>

            <div>
                <label for="time">Time</label>
                <input
                    type="time"
                    id="time"
                    name="time"
                    required
                >
            </div>

            <button type="submit">
                Add Reminder
            </button>

        </form>
        <hr>

        <h2>Your Reminders</h2>

        <div id="reminderList">
        </div>

    </div>
    <script src="popup.js"></script>    
</body>
</html>
